<div class="bg-[#d85c41] px-4 py-2 text-center text-[11px] font-bold uppercase tracking-[0.16em] text-white">
  Fresh finds, thoughtful sellers, and secure checkout—all in one market.
</div>

<header class="sticky top-0 z-30 border-b border-[#17342c]/10 bg-[#fffaf0]/95 backdrop-blur-xl">
  <div class="mx-auto flex h-[70px] max-w-7xl items-center justify-between gap-5 px-5 lg:px-8">
    <a routerLink="/home" class="group inline-flex shrink-0 items-center gap-2.5 no-underline" aria-label="Morrow Market home">
      <span class="grid h-9 w-9 place-items-center rounded-full bg-[#17342c] font-serif text-lg italic text-[#efc88c] transition-transform group-hover:-rotate-6">M</span>
      <span class="font-serif text-xl font-bold tracking-[-0.03em] text-[#17342c]">Morrow <span class="font-normal italic">Market</span></span>
    </a>

    <nav class="hidden items-center gap-7 md:flex" aria-label="Main navigation">
      <a routerLink="/user/products" class="text-sm font-semibold text-[#42564f] transition hover:text-[#d85c41]">Shop all</a>
      <a routerLink="/home" fragment="categories" class="text-sm font-semibold text-[#42564f] transition hover:text-[#d85c41]">Categories</a>
      <button type="button" class="text-sm font-semibold text-[#42564f] transition hover:text-[#d85c41]" (click)="navigateToSeller()">Sell on Morrow</button>
    </nav>

    <nav class="flex items-center gap-2" aria-label="Account navigation">
      <a routerLink="/user/cart" class="hidden rounded-full px-3 py-2 text-sm font-semibold text-[#17342c] transition hover:bg-[#17342c]/5 sm:inline-flex">Cart</a>
      @if (isAuthenticated()) {
        <button type="button" class="inline-flex items-center justify-center rounded-full border border-[#17342c]/20 px-4 py-2.5 text-sm font-bold text-[#17342c] transition hover:bg-[#17342c] hover:text-white" (click)="navigateToProfile()">
          My account
        </button>
        <app-logout-button />
      } @else {
        <button type="button" class="inline-flex items-center justify-center rounded-full bg-[#17342c] px-5 py-2.5 text-sm font-bold text-white transition hover:bg-[#244d41]" (click)="navigateToLogin()">
          Sign in
        </button>
      }
    </nav>
  </div>
</header>

<main>
  <router-outlet />
</main>
