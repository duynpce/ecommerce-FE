<div class="min-h-screen flex flex-col items-center justify-center bg-slate-50 px-4">
  <div class="w-full max-w-sm flex flex-col items-center gap-6 text-center">

    <div>
      <h1 class="text-2xl font-semibold text-slate-800 tracking-tight">Welcome home</h1>
      <p class="mt-1 text-sm text-slate-500">Where would you like to go?</p>
    </div>

    <div class="flex flex-col gap-3 w-full">

      @if (isAdmin()) {
        <a
          routerLink="/admin"
          class="flex items-center justify-center gap-2.5 w-full px-4 py-3 rounded-xl
                 bg-slate-900 text-white text-sm font-medium
                 hover:bg-slate-700 active:scale-[0.98] transition-all"
        >
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.955 11.955 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z" />
          </svg>
         go to Admin Dashboard
        </a>
      } @else {
        <a
          routerLink="/user/products"
          class="flex items-center justify-center gap-2.5 w-full px-4 py-3 rounded-xl
                 bg-slate-900 text-white text-sm font-medium
                 hover:bg-slate-700 active:scale-[0.98] transition-all"
        >
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M16.5 6v.75m0 3v.75m0 3v.75m0 3V18m-9-5.25h5.25M7.5 15h3M3.375 5.25c-.621 0-1.125.504-1.125 1.125v3.026a2.999 2.999 0 0 1 0 5.198v3.026c0 .621.504 1.125 1.125 1.125h17.25c.621 0 1.125-.504 1.125-1.125v-3.026a2.999 2.999 0 0 1 0-5.198V6.375c0-.621-.504-1.125-1.125-1.125H3.375Z" />
          </svg>
          Go to user Dashboard
        </a>
      }

    </div>
  </div>
</div>
