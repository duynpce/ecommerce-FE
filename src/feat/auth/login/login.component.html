<div [class]="ui.pageWrapper">
  <div [class]="ui.card" class="max-w-md! flex flex-col items-center gap-6">

    <!-- Header -->
    <div class="text-center">
      <h1 [class]="ui.sectionTitle">Welcome Back</h1>
      <p [class]="ui.sectionDescription" class="mt-1">Sign in to your account</p>
    </div>

    <!-- Google Sign-in -->
    <a
      [href]="keycloakLoginUrl"
      [class]="ui.buttonPrimary"
      class="w-full gap-2"
    >
      <!-- Google "G" icon -->
      <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" viewBox="0 0 24 24">
        <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
        <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Sign in with Google
    </a>

    <!-- Divider -->
    <div class="w-full flex items-center gap-3">
      <div class="flex-1 border-t border-slate-200"></div>
      <span class="text-xs text-slate-400 font-medium">or continue with</span>
      <div class="flex-1 border-t border-slate-200"></div>
    </div>

    <!-- Local Login Form -->
    <form
      class="w-full flex flex-col gap-4"
      (ngSubmit)="onLogin()"
      [formGroup]="form"
      novalidate
    >

      <!-- Username -->
      <div class="flex flex-col gap-1.5">
        <label for="username" class="text-sm font-medium text-slate-700">Username</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          placeholder="Enter your username"
          autocomplete="username"
          [class]="ui.input"
          class="w-full"
          [class.border-red-400]="isFieldInvalid('username')"
        />
        @if (isFieldInvalid('username')) {
          <p class="text-xs text-red-500">Username is required</p>
        }
      </div>

      <!-- Password -->
      <div class="flex flex-col gap-1.5">
        <label for="password" class="text-sm font-medium text-slate-700">Password</label>
        <div class="relative">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            [class]="ui.input"
            class="w-full pr-10"
            [class.border-red-400]="isFieldInvalid('password')"
          />
          <!-- Toggle password visibility -->
          <button
            type="button"
            class="absolute inset-y-0 right-3 flex items-center text-slate-400 hover:text-slate-600 transition-colors"
            (click)="showPassword = !showPassword"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          >
            @if (showPassword) {
              <!-- Eye-off icon -->
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 4.411m0 0L21 21" />
              </svg>
            } @else {
              <!-- Eye icon -->
              <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            }
          </button>
        </div>
        @if (isFieldInvalid('password')) {
          <p class="text-xs text-red-500">Password is required</p>
        }
      </div>

      <!-- API error message -->
      @if (errorMessage()) {
        <p class="text-sm text-red-500 text-center bg-red-50 border border-red-200 rounded-lg px-3 py-2">
          {{ errorMessage() }}
        </p>
      }

      <!-- Submit -->
      <button
        type="submit"
        [class]="ui.buttonSecondary"
        class="w-full"
        [disabled]="loading()"
      >
        @if (loading()) {
          <svg class="animate-spin h-4 w-4 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 22 6.477 22 12h-4z"></path>
          </svg>
          Signing in…
        } @else {
          Sign in
        }
      </button>

    </form>

    <!-- Footer -->
    <div class="w-full border-t border-slate-200"></div>
    <p class="text-sm text-slate-600">
      Don't have an account?
      <a routerLink="/register" class="font-semibold text-slate-900 underline underline-offset-2 hover:text-slate-700">
        Create one
      </a>
    </p>

  </div>
</div>
