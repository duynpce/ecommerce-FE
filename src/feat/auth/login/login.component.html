<div [class]="ui.pageWrapper">
  <div [class]="ui.card" class="max-w-md! flex flex-col items-center gap-6">

    <div class="text-center">
      <h1 [class]="ui.sectionTitle">Welcome Back</h1>
      <p [class]="ui.sectionDescription" class="mt-1">Choose how you'd like to sign in</p>
    </div>

    <div class="w-full flex flex-col gap-3">

      <!-- Remote login (Keycloak / third-party) -->
      <a
        [href]="remoteLoginUrl"
        [class]="ui.buttonPrimary"
        class="w-full gap-2"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
        </svg>
        Sign in with Remote Provider
      </a>

      <!-- Local login (Keycloak local instance) -->
      <a
        [href]="localLoginUrl"
        [class]="ui.buttonSecondary"
        class="w-full gap-2"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
        Sign in with  username and password
      </a>

    </div>

    <div class="w-full border-t border-slate-200"></div>

    <p class="text-sm text-slate-600">
      Don't have an account?
      <a routerLink="/register" class="font-semibold text-slate-900 underline underline-offset-2 hover:text-slate-700">
        Create one
      </a>
    </p>

  </div>
</div>
